name: Minimal Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  Check:

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
        pandas-version: ["2", "3"]
        exclude:
          - python-version: "3.13"
            platform: windows-latest
          - python-version: "3.14"
            platform: windows-latest
          - python-version: "3.15"
            platform: windows-latest
          - python-version: "3.10"
            pandas-version: "3"
          # pandas 2.x publishes no wheels for Python 3.15
          - python-version: "3.15"
            pandas-version: "2"
    env:
      AWS_DEFAULT_REGION: us-east-1
      # The pandas version under test is installed on top of the locked environment. Without this,
      # `uv run` re-syncs to uv.lock and silently replaces it (uv.lock pins pandas 3 on Python 3.11+).
      UV_NO_SYNC: "1"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rust latest
        run: rustup update
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Requirements
        run: uv sync --frozen --dev --verbose
        working-directory: ${{ github.workspace }}
      # --no-config is required: `uv pip install` otherwise applies [tool.uv] override-dependencies from
      # pyproject.toml, which forces pandas>=3 on Python 3.11+ and turns the install into a silent no-op.
      - name: Override pandas ${{ matrix.pandas-version }}
        if: matrix.pandas-version == '2'
        run: uv pip install --no-config "pandas>=2.0.0,<3.0.0"
      - name: Override pandas ${{ matrix.pandas-version }}
        if: matrix.pandas-version == '3'
        run: uv pip install --no-config "pandas>=3.0.0,<4.0.0"
      - name: Verify pandas major version
        run: uv run python -c "import sys, pandas; print('pandas', pandas.__version__); sys.exit(0 if pandas.__version__.split('.')[0] == '${{ matrix.pandas-version }}' else 1)"
        working-directory: ${{ github.workspace }}
      - name: Test Metadata
        run: uv run pytest tests/unit/test_metadata.py
        working-directory: ${{ github.workspace }}
      - name: Test Session
        run: uv run pytest tests/unit/test_session.py
        working-directory: ${{ github.workspace }}
      - name: Test Utils
        run: uv run pytest tests/unit/test_utils.py
        working-directory: ${{ github.workspace }}
      - name: Test Data Types
        run: uv run pytest tests/unit/test_data_types.py
        working-directory: ${{ github.workspace }}
      - name: Test Moto
        run: uv run pytest -n 4 tests/unit/test_moto.py
        working-directory: ${{ github.workspace }}
      - name: Test Data Quality rules (unit)
        run: uv run pytest tests/unit/test_data_quality_rules.py
        working-directory: ${{ github.workspace }}
      - name: Test Bedrock (mocked)
        run: uv run pytest tests/unit/test_bedrock_mocked.py
        working-directory: ${{ github.workspace }}
